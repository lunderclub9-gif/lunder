name: Isolated database regression

on:
  push:
    branches:
      - tayeb
    paths:
      - "supabase/**"
      - ".github/workflows/database-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regression:
    name: Replay migrations and run SQL suites (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tayeb source
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Start disposable local Supabase stack (native runtime)
        run: |
          supabase start --runtime native --exclude studio,mail,analytics,functions,realtime
          supabase status

      - name: Assert database endpoint is local-only
        shell: bash
        run: |
          set -euo pipefail
          supabase status --env --output-format text > /tmp/lunder-supabase.env
          set -a
          . /tmp/lunder-supabase.env
          set +a
          node -e '
            const u = new URL(process.env.DB_URL || "");
            if (!["127.0.0.1", "localhost", "::1"].includes(u.hostname)) {
              throw new Error("Refusing non-local database endpoint: " + u.hostname);
            }
            console.log("Verified isolated local PostgreSQL endpoint:", u.host);
          '
          echo "DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Replay all migrations from a clean local baseline
        run: |
          supabase db reset
          supabase migration list --local

      - name: Run SQL regression suite — security and quotation privacy
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/security_regression.sql

      - name: Run SQL regression suite — quotation immutability
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/quotation_integrity_regression.sql

      - name: Run SQL regression suite — inventory ledger
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/inventory_integrity_regression.sql

      - name: Run SQL regression suite — atomic storage quotas
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/storage_limits_regression.sql

      - name: Run SQL regression suite — tracking rate limits
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/tracking_rate_limit_regression.sql

      - name: Run SQL regression suite — manufacturing costing
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/manufacturing_costing_regression.sql

      - name: Run SQL regression suite — customer account ownership
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/customer_account_ownership_regression.sql

      - name: Record regression summary
        if: success()
        run: |
          {
            echo "## Isolated database regression"
            echo "- PostgreSQL: 17"
            echo "- Baseline: clean local Supabase stack"
            echo "- Migrations: all files in supabase/migrations, in timestamp order"
            echo "- SQL suites passed: 7 / 7"
            echo "- Target: loopback-only local database; no Supabase hosted project credentials used"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop disposable local stack
        if: always()
        run: supabase stop || true
