name: Quality checks

on:
  push:
    branches:
      - 'feature/**'
      - 'tayeb'
  pull_request:
    branches:
      - 'main'
      - 'tayeb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit (blocking)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Full dependency security audit (report only)
        id: full-audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security audit summary
        if: always()
        run: |
          if [ "${{ steps.full-audit.outcome }}" = "success" ]; then
            echo "Full dependency audit passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Full dependency audit reported vulnerabilities in the dependency tree. Production dependencies are checked separately as a blocking gate."
            echo "Full dependency audit reported vulnerabilities. Review the audit output above; this does not hide or suppress the report." >> "$GITHUB_STEP_SUMMARY"
          fi
