name: Quality checks

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Update npm to current stable
        run: npm install --global npm@latest
      - name: Refresh compatible dependency lockfile
        run: npm update --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency security audit
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit dependency lockfile security fixes
        if: github.ref == 'refs/heads/feature/lunder-premium-store-experience'
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m 'chore(deps): apply non-breaking npm audit fixes [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
